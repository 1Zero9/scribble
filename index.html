<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <!-- The Content-Security-Policy meta tag is injected by vite.config.ts so the
         browser development build can be granted the one extra source it needs
         (WebAssembly SQLite) without ever relaxing the desktop policy. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Scribble</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Scribble requires JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
